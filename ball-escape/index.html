<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="小球逃离环形圈：小球被困在层层同心圆环中，撞击会生出新的圆环，击穿缺口才能层层突破。">
  <meta name="theme-color" content="#06060f">
  <title>小球逃离环形圈 · 动效集萃</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2322d3ee' stroke-width='2.5' stroke-dasharray='70 12'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23a855f7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="app">
    <main class="stage" id="stage">
      <canvas id="canvas" class="canvas" aria-label="小球逃离环形圈动画画布" role="img"></canvas>

      <div class="hud">
        <div class="hud-item">
          <span class="hud-label">剩余层数</span>
          <span class="hud-value" id="hudRings">8</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">已逃离</span>
          <span class="hud-value" id="hudEscaped">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">耗时</span>
          <span class="hud-value hud-value--time" id="hudTime">00:00.0</span>
        </div>
      </div>

      <div class="overlay" id="startOverlay">
        <div class="panel-card overlay-card">
          <p class="overlay-eyebrow">BALL&nbsp;ESCAPE</p>
          <h2 class="overlay-title">小球逃离环形圈</h2>
          <p class="overlay-text">
            小球被困在层层同心圆环之中，每一次撞击都会在外侧多生出一层圆环。<br>
            对准旋转的缺口冲出去，逃出全部圆环，动画即结束并结算耗时。
          </p>
          <ul class="overlay-hints">
            <li>圆环不停转动，各层快慢与方向都不同</li>
            <li>撞击会让缺口一点点变大，越撞越可能逃出</li>
            <li>空格暂停 / 继续，R 键重开</li>
          </ul>
          <button type="button" class="btn btn--primary" id="startBtn">开 始</button>
        </div>
      </div>

      <div class="overlay" id="resultOverlay" hidden>
        <div class="panel-card overlay-card overlay-card--result">
          <h2 class="overlay-title" id="resultTitle">小球成功逃离！</h2>
          <p class="overlay-text" id="resultText"></p>
          <div class="overlay-actions">
            <button type="button" class="btn btn--primary" id="againBtn">再来一次</button>
            <a class="btn btn--ghost" href="../">返回集萃</a>
          </div>
        </div>
      </div>
    </main>

    <aside class="panel" aria-label="参数调节面板">
      <header class="panel-head">
        <h1 class="panel-title">小球逃离环形圈</h1>
        <p class="panel-sub">Ball Escape · 2D 动画</p>
      </header>

      <div class="panel-body">
        <div class="ctrl">
          <label class="ctrl-label" for="optRings">
            <span>圆环层数</span><output class="ctrl-out" id="optRingsOut">8 层</output>
          </label>
          <input class="range" type="range" id="optRings" min="3" max="24" step="1" value="8">
        </div>

        <div class="ctrl">
          <label class="ctrl-label" for="optSpeed">
            <span>旋转速度</span><output class="ctrl-out" id="optSpeedOut">1.00×</output>
          </label>
          <input class="range" type="range" id="optSpeed" min="0" max="2" step="0.05" value="1">
        </div>

        <div class="ctrl">
          <label class="ctrl-label" for="optGap">
            <span>缺口大小</span><output class="ctrl-out" id="optGapOut">26°</output>
          </label>
          <input class="range" type="range" id="optGap" min="8" max="60" step="1" value="26">
        </div>

        <div class="ctrl">
          <label class="ctrl-label" for="optAdd">
            <span>每次碰撞新增层数</span><output class="ctrl-out" id="optAddOut">1 层</output>
          </label>
          <input class="range" type="range" id="optAdd" min="1" max="3" step="1" value="1">
        </div>

        <div class="ctrl ctrl--switch">
          <label class="switch">
            <input type="checkbox" id="countdownOn">
            <span class="switch-box" aria-hidden="true"></span>
            <span class="switch-text">倒计时挑战（默认关闭）</span>
          </label>
          <div class="countdown" id="countdownWrap" hidden>
            <label for="countdownSec">限时</label>
            <input type="number" id="countdownSec" min="10" max="600" step="5" value="60">
            <span>秒</span>
          </div>
        </div>
      </div>

      <footer class="panel-foot">
        <div class="panel-actions">
          <button type="button" class="btn btn--ghost" id="pauseBtn">暂停</button>
          <button type="button" class="btn btn--ghost" id="restartBtn">重开</button>
        </div>
        <p class="panel-tip">默认参数经过调校：小球最终能逃出全部圆环，但不轻松。调整参数会自动重开一局。</p>
      </footer>
    </aside>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/ring.js"></script>
  <script src="./js/ball.js"></script>
  <script src="./js/particles.js"></script>
  <script src="./js/physics.js"></script>
  <script src="./js/camera.js"></script>
  <script src="./js/render.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
